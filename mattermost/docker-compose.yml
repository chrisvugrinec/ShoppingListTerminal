services:
  postgres:
    image: postgres:15-alpine
    container_name: mattermost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mm_password_change_me
      POSTGRES_DB: mattermost
    volumes:
      - ./postgres:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      # bind to localhost only; your VPS will reach it via WireGuard later
      - "127.0.0.1:8065:8065"
      # OR bind to WireGuard IP instead, e.g.:
      # - "10.44.0.2:8065:8065"
    environment:
      TZ: Europe/Amsterdam
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mm_password_change_me@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: "https://chat.example.com"
      MM_BLEVESETTINGS_INDEXDIR: "/mattermost/bleve-indexes"
    volumes:
      - ./config:/mattermost/config
      - ./data:/mattermost/data
      - ./logs:/mattermost/logs
      - ./plugins:/mattermost/plugins
      - ./client-plugins:/mattermost/client/plugins
      - ./bleve-indexes:/mattermost/bleve-indexes
